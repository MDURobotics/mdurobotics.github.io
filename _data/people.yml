# Lab members. `diva` is the person's DiVA id: open their name in
# https://mdu.diva-portal.org and copy the "personId" from the URL
# (usually their MDU username, e.g. abc01). One person can have several
# ids in DiVA; list all of them. Publications are fetched for everyone
# here by scripts/fetch_publications.py.
#
# - name: "Firstname Lastname"
#   role: "Professor"
#   role_sv: "Professor"          # role in Swedish
#   diva: ["abc01"]
#   scholar: "abcDEF0AAAAJ"        # optional: Google Scholar user id (the user= part of the profile URL)
#   email: "firstname.lastname@mdu.se"  # optional
#   contact: true                  # optional: list on the Contact page
