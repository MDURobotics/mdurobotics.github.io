# Publications that DiVA is missing, or has without linking them to the
# right person. Merged into the publications page by
# scripts/fetch_publications.py.
#
# The real fix is in DiVA: register new publications there, and ask the
# library to link existing records to the right person. Entries below are
# then picked up automatically, and the script prints which ones can be
# removed from this file.
#
# Point at an existing DiVA record:
#   - diva: "diva2:1234567"
# or describe the publication:
#   - title: "Paper title"
#     year: 2026
#     type: "Conference paper"   # Journal article, Book chapter, Book, Report, PhD thesis, Licentiate thesis
#     authors: ["First Author", "Second Author"]
#     venue: "Conference or journal"
#     doi: "10.xxxx/yyyy"        # optional
#     url: "https://..."         # optional

