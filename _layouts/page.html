---
layout: default
---
<div class="wrap">
  <header class="pagehead">
    <span class="label">{{ page.label | default: site.title }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</div>
