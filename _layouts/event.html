---
layout: default
---
<div class="wrap">
  <header class="pagehead">
    <a class="label back" href="{{ '/events/' | relative_url }}">← Events</a>
    <h1>{{ page.title }}</h1>
  </header>
  <dl class="facts facts--inline">
    <div><dt>Date</dt><dd>{{ page.date | date: "%-d %B %Y" }}</dd></div>
    {% if page.time %}<div><dt>Time</dt><dd>{{ page.time }}</dd></div>{% endif %}
    {% if page.location %}<div><dt>Where</dt><dd>{{ page.location }}</dd></div>{% endif %}
  </dl>
  <div class="prose">
    {{ content }}
  </div>
</div>
