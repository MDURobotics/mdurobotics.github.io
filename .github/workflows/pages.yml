name: Deploy site

# Builds with Jekyll and deploys to GitHub Pages. The base path comes from
# configure-pages, so the same workflow works for a project repo
# (user.github.io/repo) and for the org site (mdurobotics.github.io).
on:
  push:
    branches: [main]
  workflow_run:            # commits made by the publications bot don't trigger push workflows
    workflows: ["Update publications"]
    types: [completed]
  schedule:                # nightly rebuild so past events move to the archive even without JS
    - cron: "15 0 * * *"   # 01:15/02:15 Swedish time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
