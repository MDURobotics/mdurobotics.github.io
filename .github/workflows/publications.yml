name: Update publications

on:
  schedule:
    - cron: "0 4 * * 1"   # Mondays 04:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab
  push:
    paths:
      - _data/people.yml
      - _data/publications_extra.yml
      - scripts/fetch_publications.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_publications.py
      - name: Commit if changed
        run: |
          if git diff --quiet _data/publications.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json
          git commit -m "Update publications from DiVA"
          git push
