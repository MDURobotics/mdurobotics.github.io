title: "MDU Robotics"
description: "Robotics research at Mälardalen University"
tagline: "Robots that sense, plan and act — built at Mälardalen University."
url: "https://mdurobotics.github.io"
baseurl: ""
lang: "en"
github: "https://github.com/mdurobotics"
location: "Västerås, Sweden"

# Events are dated in the future; without this Jekyll skips them
future: true

include:
  - _pages

collections:
  projects:
    output: true
    permalink: /projects/:name/
  events:
    output: true
    permalink: /events/:name/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: "sv"
  - scope:
      path: ""
      type: events
    values:
      layout: event

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - serve.sh
