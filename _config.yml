title: "MDU Robotics"
description: "Robotics research at Mälardalen University"
tagline: "Robots that sense, plan and act — built at Mälardalen University."
url: "https://mdurobotics.github.io"
baseurl: ""
lang: "en"
# Dates and "today" are Swedish time (the build server runs in UTC)
timezone: "Europe/Stockholm"
github: "https://github.com/mdurobotics"
location: "Västerås, Sweden"
# Shown on /tillganglighet/ (required by lag 2018:1937). TODO: set before going public
accessibility_contact: ""
# Student projects from this year are shown first; older years go under "Tidigare år"
projects_current_year: 2026

# Events are dated in the future; without this Jekyll skips them
future: true

include:
  - _pages

collections:
  projects:
    output: true
    permalink: /student-projects/:name/
  events:
    output: true
    permalink: /events/:name/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: "sv"
  - scope:
      path: ""
      type: events
    values:
      layout: event
      lang: "sv"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - NOTES.md
  - notes
  - serve.sh
  - scripts
